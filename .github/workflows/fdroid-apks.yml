# The APKs F-Droid compares its own build against. Reproducible builds mean
# F-Droid rebuilds from source and the result must be byte-identical to what we
# publish here, so every step below has a twin in fdroiddata's recipe
# (metadata/com.byarchitect.linkstow.yml): the same Flutter tag, the same
# PUB_CACHE inside apps/flutter, the same build-id fix, one build per CPU type.
#
# The build path matters as much as the steps: Flutter bakes the absolute path
# of .dart_tool/flutter_build/dart_plugin_registrant.dart into libapp.so, and a
# hash of it spreads through the Dart snapshot. Here that path is always
# /home/runner/work/KarakeepMobile/KarakeepMobile, and F-Droid's recipe moves
# its checkout there before building. Change one side, change the other.
name: fdroid-apks

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to build, e.g. v0.1.1'
        required: true

jobs:
  apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Java 21, as on F-Droid's builder (Debian trixie) and the release machine.
      # The runner's default is older, and AGP's lint calls List.removeLast(),
      # which only exists from 21 — it crashes the release build without this.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # the Flutter tag the app pins, the way fdroiddata's prebuild reads it
      - name: Flutter, at the pinned tag
        run: |
          set -eu
          version=$(sed -n -E 's/.*"flutter"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' apps/flutter/.fvmrc)
          [ -n "$version" ]
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Upload key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build one APK per CPU type
        working-directory: apps/flutter
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eux
          export PUB_CACHE="$(pwd)/.pub-cache"
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          # package:jni's linker stamps a build id into libdartjni.so that differs
          # between machines; fdroiddata's recipe switches it off, so do the same
          sed -i -e '/^cmake_minimum_required/a add_link_options("LINKER:--build-id=none")' \
            "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt
          for target in android-arm android-arm64 android-x64; do
            flutter build apk --release --split-per-abi --target-platform="$target"
          done

      - name: Name them the way the metadata expects
        working-directory: apps/flutter
        run: |
          set -eux
          version=$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+.*/\1/p' pubspec.yaml)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "$GITHUB_WORKSPACE/dist/linkstow-$version-$abi.apk"
          done

      - name: Replace the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/*.apk --clobber
