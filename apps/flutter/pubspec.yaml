name: linkstow
description: "Linkstow — an unofficial mobile client for self-hosted Karakeep."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cached_network_image: ^4.0.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  material_ui: ^1.1.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# Launcher icons: `python3 tool/generate_app_icon.py`, then
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
